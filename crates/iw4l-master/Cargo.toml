[package]
name = "iw4l-master"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Standalone relay-only IW4L master, browser and opaque packet service."

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
getrandom = "0.3"
ring = "0.17"
master_protocol.workspace = true
quinn = { version = "0.11.11", default-features = false, features = ["platform-verifier", "runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2.0"
rustls-platform-verifier = "0.7.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
