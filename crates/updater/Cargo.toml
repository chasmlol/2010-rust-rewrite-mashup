[package]
name = "updater"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Community configuration and HTTPS self-update before game startup."

[dependencies]
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-manual-roots"] }
fs2 = "0.4"
zstd = { version = "0.13", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[lints]
workspace = true
