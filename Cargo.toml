# Transcribing a retail constant at full precision is the requirement, not a
# style slip. `clippy::excessive_precision` fired on
# `0.0005882352706976235` — the exact f32 read out of the retail image with
# `re data` — and rejected an iteration that had ported two more branches of
# PM_Friction. Shortening such a literal to "enough" digits is the silent
# approximation this project exists to forbid, so the lint has to go rather
# than the digits.
[workspace.lints.clippy]
excessive_precision = "allow"
# Retail constants must preserve the transcribed f32 bits. Replacing a literal
# with a mathematical standard-library constant can change those bits.
approx_constant = "allow"
assertions_on_constants = "deny"

# Measured and kept: wall p50 -5.7%, binary 183 MB -> 114 MB. Do not drop these
# two lines without a new two-map A/B on the same protocol.
#
# Live recipes (`make map` / `play` / `bench` / `bench-live` / …) do not use this profile.
# Fat LTO: `PROFILE=release` on a live target when the number must match the
# LTO binary's.
# Fat LTO + one codegen unit stay on this profile only. `make deploy` does not
# select it; that is `PROFILE=release`.
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

# The dev loop, including `make bench` and the default Windows/master
# deploy path. Same opt-level as release (Bevy is unusable without it), minus
# the two settings whose cost is paid at *link* time: fat LTO over the whole
# dependency graph in one codegen unit is a single-threaded rustc at ~6.6 GB
# that reruns after an edit in any crate. That link was timed at 13m03s.
# That link, not the game, is what `make play` was waiting on.
#
# `lto = false` keeps crate-local ThinLTO; `"off"` is not required.
# Incremental is for workspace recompiles after the first fill of this
# profile cache. Strip lives here, not in RUSTFLAGS: env RUSTFLAGS override
# target rustflags and would split the play/release fingerprint.
#
# Separate profile rather than a relaxed `[profile.release]`: the release
# binary the published numbers describe has to stay buildable.
# Frame-time cost of `play` vs `release` is NOT measured here — that A/B is
# `make bench <demo>` vs `make bench <demo> PROFILE=release`.
[profile.play]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
incremental = true
strip = "symbols"

# The binary a sampler can read (`make bench-perf`). Same code as
# [profile.play] — opt-level and codegen-units unchanged, so the frame times it
# samples are the frame times `make bench-live` reports — plus the two things
# perf needs and a release build drops: DWARF line tables (`debug = 1`) to name
# a frame, and a frame pointer in every function (`-Cforce-frame-pointers=yes`,
# set by the recipe) so `--call-graph fp` can walk out of it. Strip is off so
# those line tables survive. Its own profile dir: play/release fingerprints
# stay one cache, no relink on a bench↔perf switch.
[profile.perf]
inherits = "play"
debug = 1
strip = "none"
